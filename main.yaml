- name: Read secrets
  hosts: localhost
  tasks:
    - name: Read a kv2 secret
      ansible.builtin.debug:
        msg:
        - "{{ secrets.MYSQL_PASS }}"
        - "{{ secrets.MYSQL_USER }}"
      vars:
        secrets: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=expense-dev/data/backend token={{token}} url=https://172.31.35.13:8200 validate_certs=false') }}"

    - name: debug of data
      ansible.builtin.debug:
        msg: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=expense-dev/data/backend token={{token}} url=https://172.31.35.13:8200 validate_certs=false') }}"
