---
- name: Read secret from Vault KV v2
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Read secret
      ansible.builtin.set_fact:
        vault_secret: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/hello:value token={{ vault_token }} url=https://172.31.35.13:8200 validate_certs=false') }}"
#      no_log: true

    - name: Show secret
      ansible.builtin.debug:
        var: vault_secret
      no_log: true