---
- name: Read secret from Vault KV v2
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Read secret
      community.hashi_vault.vault_kv2_get:
        url: "https://172.31.35.13:8200"
        validate_certs: false
        token: "{{ vault_token }}"
        engine_mount_point: "expence-dev"
        path: "my-secret"
      register: vault_secret

    - name: Show secret
      debug:
        var: vault_secret.secret